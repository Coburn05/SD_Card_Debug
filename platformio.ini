; SD card over SPI1 bring-up / debug for the Nucleo-H753ZI
; Uses the same toolchain as rocket-base-2026 (PlatformIO + stm32duino Arduino core).
;
; NOTE: rocket-base-2026 uses stm32duino/STM32SD + FatFs, but STM32SD only talks
; to the SDMMC peripheral (4-bit SDIO bus). It cannot run over SPI, so the
; filesystem part of this test uses SdFat, which drives the card through the
; stock Arduino SPI library.

[env:nucleo_h753zi]
platform = ststm32@19.6.0
framework = arduino
board = nucleo_h753zi
monitor_speed = 115200
build_flags =
	-Wall
	-Wl,-u,_printf_float    ; enable %f in Serial.printf (newlib-nano)
lib_deps =
	SPI
	thijse/ArduinoLog@^1.1.1
	greiman/SdFat@^2.2.3
